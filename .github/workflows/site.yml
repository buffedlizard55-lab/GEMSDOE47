name: Refresh permitted public-source feed

on:
  push:
    branches: [main, arena/e08adc4a-gemsdoe47]
    paths:
      - '.github/workflows/site.yml'
      - 'scripts/refresh_source_feed.py'
      - 'scripts/publish_probe_check.py'
      - 'docs/assets/site.js'
      - 'registry/current-source-list.json'
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: permitted-source-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # On push use the exact triggering branch; scheduled runs use default main.
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Refresh only permitted government and owner sources
        run: python scripts/refresh_source_feed.py
      - name: Publish auditable JSON through the public Checks API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python scripts/publish_probe_check.py --receipt docs/data/source-feed.json --name 'Permitted public source feed'
