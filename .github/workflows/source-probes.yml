name: Public official data feasibility

on:
  push:
    branches: [arena/50b2a166-gemsdoe47]
    paths:
      - '.github/workflows/source-probes.yml'
      - 'scripts/probe_official_data.py'
      - 'scripts/restore_data.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore hash-pinned labels and template only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_data.py --only labels,sample_submission
      - name: Download public official archives and measure coverage
        env:
          PYTHONPATH: src
        run: python -u scripts/probe_official_data.py
      - name: Publish public receipt through API-readable neutral check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_probe_check.py --receipt evidence/official-download-probes.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-download-receipts
          path: evidence/official-download-probes.json
          if-no-files-found: error
