name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run lint
        run: python -m ruff check .
      # Two suites coexist in this repository after the 2026-10-06 merge:
      #   * the earlier session's unittest suite (gemsdoe47/, src/gems47_*.py, site integrity)
      #   * the later session's pytest suite   (src/gems47/, metric algebra, writer, LATI)
      # PYTHONPATH=src lets the pytest modules import gems47 without conftest.py, so
      # unittest discovery can import them without error even though it collects none
      # of their tests (they define no TestCase subclasses).
      - name: Run unit and site-integrity tests (unittest suite)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run all pytest tests, including detector, conformal, exporter and feed
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q -m 'not needs_data'
      # Real restored-grid tests are run locally with all 23 verified inputs;
      # CI still reopens the actual new release TIFF in test_current_artifact.py.
      # tests/test_shipped.py is marked needs_data: it re-verifies the shipped GeoTIFFs
      # against the real 3730x3292 competition grid, which requires the ~507 MB of
      # restored bytes. Run it locally after `scripts/restore_data.py --group all`.
